exclude = [
  "target/**",
  "*.lock",
  ".github/**",
  "docs/**",
  # Integration tests and benches idiomatically use unwrap()/panic! (the same
  # code clippy's unwrap_used allow covers); score shipped code only.
  "crates/*/tests/**",
  "crates/*/benches/**",
]

[complexity]
cyclomatic_error = 20
cognitive_error = 30

[churn]
since = "6m"
top = 20

[duplicates]
min_tokens = 50
min_similarity = 0.85

[hotspot]
top = 20

[score]
fail_under = 85
