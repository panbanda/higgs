name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs['crates/higgs--release_created'] }}
      tag_name: ${{ steps.release.outputs['crates/higgs--tag_name'] }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build (${{ matrix.target }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create archive
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#higgs-v}"
          ARCHIVE_NAME="higgs_${VERSION}_${{ matrix.target }}"
          METALLIB="$(find target/${{ matrix.target }}/release/build -path '*/out/build/lib/mlx.metallib' -exec stat -f '%m %N' {} \; | sort -nr | head -n 1 | cut -d' ' -f2-)"

          mkdir -p dist
          cp target/${{ matrix.target }}/release/higgs dist/
          test -n "$METALLIB"
          cp "$METALLIB" dist/mlx.metallib
          cd dist
          tar -czvf "${ARCHIVE_NAME}.tar.gz" higgs mlx.metallib
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber

  publish:
    name: Publish to crates.io
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Check crates.io publishability
        id: publishability
        run: |
          if grep -Eq '^mlx-(rs|sys)\s*=\s*\{[^}]*git\s*=' Cargo.toml; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "Skipping crates.io publish: release artifacts depend on unreleased mlx-rs git revisions."
            exit 0
          fi

          echo "publishable=true" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Publish higgs-models
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        run: |
          out=$(cargo publish -p higgs-models --token ${{ secrets.CARGO_REGISTRY_TOKEN }} 2>&1) && echo "$out" || {
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          }

      - name: Wait for crates.io to index higgs-models
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        run: sleep 30

      - name: Publish higgs-engine
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        run: |
          out=$(cargo publish -p higgs-engine --token ${{ secrets.CARGO_REGISTRY_TOKEN }} 2>&1) && echo "$out" || {
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          }

      - name: Wait for crates.io to index higgs-engine
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        run: sleep 30

      - name: Publish higgs
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        run: |
          out=$(cargo publish -p higgs --token ${{ secrets.CARGO_REGISTRY_TOKEN }} 2>&1) && echo "$out" || {
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          }

  homebrew:
    name: Update Homebrew Formula
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Download release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          TAG="${{ needs.release-please.outputs.tag_name }}"
          gh release download "$TAG" --pattern "*.tar.gz" --dir dist
          gh release download "$TAG" --pattern "*.sha256" --dir dist

      - name: Create consolidated checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          cat dist/*.sha256 | sort > dist/checksums.txt
          gh release upload "$TAG" dist/checksums.txt --clobber

      - name: Generate Homebrew formula
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#higgs-v}"

          DARWIN_ARM64_SHA=$(cat dist/higgs_${VERSION}_aarch64-apple-darwin.tar.gz.sha256 | cut -d' ' -f1)

          cat > higgs.rb << EOF
          class Higgs < Formula
            desc "Local LLM inference server for Apple Silicon using MLX"
            homepage "https://github.com/panbanda/higgs"
            version "${VERSION}"
            license "MIT OR Apache-2.0"

            depends_on :macos
            depends_on arch: :arm64
            depends_on "hf"

            url "https://github.com/panbanda/higgs/releases/download/${TAG}/higgs_${VERSION}_aarch64-apple-darwin.tar.gz"
            sha256 "${DARWIN_ARM64_SHA}"

            def install
              bin.install "higgs"
              bin.install "mlx.metallib"
            end

            test do
              system "#{bin}/higgs", "--help"
            end
          end
          EOF

          if [ -n "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/panbanda/homebrew-brews.git" tap
            mkdir -p tap/Formula
            cp higgs.rb tap/Formula/higgs.rb

            cd tap
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Formula/higgs.rb
            git commit -m "Update higgs to ${VERSION}"
            git push
          fi
