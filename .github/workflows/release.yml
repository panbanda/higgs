name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs['crates/higgs--release_created'] }}
      tag_name: ${{ steps.release.outputs['crates/higgs--tag_name'] }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build (${{ matrix.target }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create archive
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#higgs-v}"
          ARCHIVE_NAME="higgs_${VERSION}_${{ matrix.target }}"
          METALLIB="$(find target/${{ matrix.target }}/release/build -path '*/out/build/lib/mlx.metallib' -exec stat -f '%m %N' {} \; | sort -nr | head -n 1 | cut -d' ' -f2-)"

          mkdir -p dist
          cp target/${{ matrix.target }}/release/higgs dist/
          test -n "$METALLIB"
          cp "$METALLIB" dist/mlx.metallib
          cd dist
          tar -czvf "${ARCHIVE_NAME}.tar.gz" higgs mlx.metallib
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber

  desktop:
    name: Desktop app (aarch64-apple-darwin)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link
    # Protected environment: add required reviewers to it in the repo settings
    # so publishing the bundle needs an approval.
    environment: release
    permissions:
      contents: write

    # No dependency or build caches here: this job publishes the shipped
    # bundle, and caches written by PR-triggered CI runs must not feed it.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # The write-scoped token is only needed by `gh release upload`,
          # which reads GITHUB_TOKEN from the environment.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Stamp app version from the release tag
        working-directory: apps/desktop
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#higgs-v}"
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          ' "$VERSION"

      - name: Build higgs CLI for bundling
        run: cargo build --release --target aarch64-apple-darwin -p higgs

      - name: Bundle CLI into desktop resources
        # The desktop app has no dependency on the `higgs` crate; it only
        # needs the built binary and mlx.metallib copied into
        # apps/desktop/src-tauri/resources/bin so tauri.conf.json's
        # bundle.resources picks them up during `tauri build` below.
        run: |
          METALLIB="$(find target/aarch64-apple-darwin/release/build -path '*/out/build/lib/mlx.metallib' -exec stat -f '%m %N' {} \; | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$METALLIB"

          mkdir -p apps/desktop/src-tauri/resources/bin
          cp target/aarch64-apple-darwin/release/higgs apps/desktop/src-tauri/resources/bin/higgs
          cp "$METALLIB" apps/desktop/src-tauri/resources/bin/mlx.metallib
          chmod +x apps/desktop/src-tauri/resources/bin/higgs

      - name: Build app bundle
        working-directory: apps/desktop
        # Unsigned: the bundle is not notarized, so first launch needs
        # right-click > Open (or `xattr -dr com.apple.quarantine Higgs.app`).
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Collect bundles
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#higgs-v}"
          BUNDLE="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          mkdir -p dist
          cp "$BUNDLE"/dmg/*.dmg "dist/Higgs_${VERSION}_aarch64.dmg"
          ditto -c -k --keepParent "$BUNDLE/macos/Higgs.app" "dist/Higgs_${VERSION}_aarch64.app.zip"
          cd dist
          shasum -a 256 *.dmg *.zip > "Higgs_${VERSION}_aarch64.sha256"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          gh release upload "$TAG" dist/*.dmg dist/*.zip dist/*.sha256 --clobber

  publish:
    name: Publish to crates.io
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Check crates.io publishability
        id: publishability
        run: |
          if grep -Eq '^mlx-(rs|sys)\s*=\s*\{[^}]*git\s*=' Cargo.toml; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "Skipping crates.io publish: release artifacts depend on unreleased mlx-rs git revisions."
            exit 0
          fi

          echo "publishable=true" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Publish higgs-models
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        run: |
          out=$(cargo publish -p higgs-models --token ${{ secrets.CARGO_REGISTRY_TOKEN }} 2>&1) && echo "$out" || {
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          }

      - name: Wait for crates.io to index higgs-models
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        run: sleep 30

      - name: Publish higgs-engine
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        run: |
          out=$(cargo publish -p higgs-engine --token ${{ secrets.CARGO_REGISTRY_TOKEN }} 2>&1) && echo "$out" || {
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          }

      - name: Wait for crates.io to index higgs-engine
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        run: sleep 30

      - name: Publish higgs
        if: ${{ steps.publishability.outputs.publishable == 'true' }}
        run: |
          out=$(cargo publish -p higgs --token ${{ secrets.CARGO_REGISTRY_TOKEN }} 2>&1) && echo "$out" || {
            echo "$out"
            echo "$out" | grep -q "already exists" || exit 1
          }

  homebrew:
    name: Update Homebrew Formula
    needs: [release-please, build, desktop]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Download release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          TAG="${{ needs.release-please.outputs.tag_name }}"
          gh release download "$TAG" --pattern "*.tar.gz" --dir dist
          gh release download "$TAG" --pattern "*.sha256" --dir dist

      - name: Create consolidated checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          cat dist/*.sha256 | sort > dist/checksums.txt
          gh release upload "$TAG" dist/checksums.txt --clobber

      - name: Generate Homebrew formula and cask
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#higgs-v}"

          DARWIN_ARM64_SHA=$(cat dist/higgs_${VERSION}_aarch64-apple-darwin.tar.gz.sha256 | cut -d' ' -f1)
          DESKTOP_DMG_SHA=$(grep '\.dmg$' "dist/Higgs_${VERSION}_aarch64.sha256" | cut -d' ' -f1)

          cat > higgs.rb << EOF
          class Higgs < Formula
            desc "Local LLM inference server for Apple Silicon using MLX"
            homepage "https://github.com/panbanda/higgs"
            version "${VERSION}"
            license "MIT OR Apache-2.0"

            depends_on :macos
            depends_on arch: :arm64
            depends_on "hf"

            url "https://github.com/panbanda/higgs/releases/download/${TAG}/higgs_${VERSION}_aarch64-apple-darwin.tar.gz"
            sha256 "${DARWIN_ARM64_SHA}"

            def install
              bin.install "higgs"
              bin.install "mlx.metallib"
            end

            test do
              system "#{bin}/higgs", "--help"
            end
          end
          EOF

          cat > higgs-desktop.rb << EOF
          cask "higgs-desktop" do
            version "${VERSION}"
            sha256 "${DESKTOP_DMG_SHA}"

            url "https://github.com/panbanda/higgs/releases/download/${TAG}/Higgs_${VERSION}_aarch64.dmg"
            name "Higgs"
            desc "Desktop dashboard and chat UI for the Higgs inference server; bundles the higgs CLI"
            homepage "https://github.com/panbanda/higgs"

            depends_on macos: :sonoma
            depends_on arch: :arm64

            app "Higgs.app"

            caveats <<~EOS
              Higgs.app is not notarized. On first launch, right-click the app
              and choose Open, or run:
                xattr -dr com.apple.quarantine /Applications/Higgs.app
            EOS
          end
          EOF

          if [ -n "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/panbanda/homebrew-brews.git" tap
            mkdir -p tap/Formula tap/Casks
            cp higgs.rb tap/Formula/higgs.rb
            cp higgs-desktop.rb tap/Casks/higgs-desktop.rb

            cd tap
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Formula/higgs.rb Casks/higgs-desktop.rb
            git commit -m "Update higgs to ${VERSION}"
            git push
          fi
