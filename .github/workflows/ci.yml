name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link — deployment-target mismatch
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Bust cache poisoned by mlx-sys .air built on a different Xcode/macOS
          # image (AIR 2.8 vs 2.7 link mismatch). Bump when the pinned image changes.
          prefix-key: "v1-mlx-air-macos15"

      - name: Run tests
        run: cargo test --all-features -- --test-threads=1

  build:
    name: Build
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link — deployment-target mismatch
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Bust cache poisoned by mlx-sys .air built on a different Xcode/macOS
          # image (AIR 2.8 vs 2.7 link mismatch). Bump when the pinned image changes.
          prefix-key: "v1-mlx-air-macos15"

      - name: Build release
        run: cargo build --release

  lint:
    name: Lint
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link — deployment-target mismatch
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Bust cache poisoned by mlx-sys .air built on a different Xcode/macOS
          # image (AIR 2.8 vs 2.7 link mismatch). Bump when the pinned image changes.
          prefix-key: "v1-mlx-air-macos15"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features

  msrv:
    name: MSRV
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link — deployment-target mismatch
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # 1.88.0
        with:
          toolchain: "1.97.0"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Bust cache poisoned by mlx-sys .air built on a different Xcode/macOS
          # image (AIR 2.8 vs 2.7 link mismatch). Bump when the pinned image changes.
          prefix-key: "v1-mlx-air-macos15"

      - name: Check MSRV
        run: cargo check --all-features

  coverage:
    name: Coverage
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link — deployment-target mismatch
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Bust cache poisoned by mlx-sys .air built on a different Xcode/macOS
          # image (AIR 2.8 vs 2.7 link mismatch). Bump when the pinned image changes.
          prefix-key: "v1-mlx-air-macos15"

      - name: Generate coverage and enforce threshold
        run: |
          cargo llvm-cov \
            --all-features \
            --workspace \
            --fail-under-lines 70 \
            --ignore-filename-regex '(qwen3_next|batch_engine|simple|siglip|llava_qwen2)\.rs|higgs/src/(main|state|lib)\.rs|routes/(anthropic|completions|embeddings)\.rs' \
            -- --test-threads=1

      - name: Generate LCOV report
        if: success() || failure()
        run: |
          cargo llvm-cov \
            --all-features \
            --workspace \
            --lcov \
            --output-path lcov.info \
            --ignore-filename-regex '(qwen3_next|batch_engine|simple|siglip|llava_qwen2)\.rs|higgs/src/(main|state|lib)\.rs|routes/(anthropic|completions|embeddings)\.rs' \
            -- --test-threads=1

      - name: Upload LCOV report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info

  omen:
    name: Omen Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run Omen
        uses: panbanda/omen@omen-v4.24.1
        id: omen
        with:
          version: "4.24.1"
          comment: false
          label: false
          check: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
