name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -Dwarnings
  # mlx-sys compiles the metallib to MLX_RS_METAL_PATH (default $HOME/.mlx,
  # which the rust-cache never restores). Keep it in the workspace, outside
  # target/ because rust-cache prunes unknown files there on save, and cache
  # it explicitly with cache-directories on every root rust-cache step.
  MLX_RS_METAL_PATH: ${{ github.workspace }}/.mlx-metal

jobs:
  test:
    name: Test
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link — deployment-target mismatch
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Bust cache poisoned by mlx-sys .air built on a different Xcode/macOS
          # image (AIR 2.8 vs 2.7 link mismatch). Bump when the pinned image changes.
          prefix-key: "v2-mlx-air-macos15"
          cache-directories: ${{ github.workspace }}/.mlx-metal

      - name: Run tests
        run: cargo test --all-features -- --test-threads=1

  build:
    name: Build
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link — deployment-target mismatch
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Bust cache poisoned by mlx-sys .air built on a different Xcode/macOS
          # image (AIR 2.8 vs 2.7 link mismatch). Bump when the pinned image changes.
          prefix-key: "v2-mlx-air-macos15"
          cache-directories: ${{ github.workspace }}/.mlx-metal

      - name: Build release
        run: cargo build --release

  desktop:
    name: Desktop app
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link — deployment-target mismatch
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
          prefix-key: "v1-desktop"

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build frontend
        working-directory: apps/desktop
        run: pnpm typecheck && pnpm build

      - name: Assert the dev-only local bridge is not bundled
        working-directory: apps/desktop
        run: |
          if grep -rq "__local" dist/assets; then
            echo "dev local bridge leaked into the production bundle" >&2
            exit 1
          fi

      - name: Lint and test Tauri backend
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets
          cargo test

  bench-smoke:
    name: Bench smoke
    # Advisory until model-backed validation has stabilized across macOS runners.
    continue-on-error: true
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link — deployment-target mismatch
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "v2-mlx-air-macos15"
          cache-directories: ${{ github.workspace }}/.mlx-metal

      - name: Test validation PII scrubber
        run: python3 scripts/validate/test_scrub.py

      - name: Exercise validation runner offline
        run: scripts/validate/run.sh --self-test

  lint:
    name: Lint
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link — deployment-target mismatch
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Bust cache poisoned by mlx-sys .air built on a different Xcode/macOS
          # image (AIR 2.8 vs 2.7 link mismatch). Bump when the pinned image changes.
          prefix-key: "v2-mlx-air-macos15"
          cache-directories: ${{ github.workspace }}/.mlx-metal

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features

  msrv:
    name: MSRV
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link — deployment-target mismatch
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # 1.88.0
        with:
          toolchain: "1.98.0"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Bust cache poisoned by mlx-sys .air built on a different Xcode/macOS
          # image (AIR 2.8 vs 2.7 link mismatch). Bump when the pinned image changes.
          prefix-key: "v2-mlx-air-macos15"
          cache-directories: ${{ github.workspace }}/.mlx-metal

      - name: Check MSRV
        run: cargo check --all-features

  coverage:
    name: Coverage
    runs-on: macos-15 # pinned: macos-latest (macOS 26/Xcode 26.5) breaks MLX metallib link — deployment-target mismatch
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Bust cache poisoned by mlx-sys .air built on a different Xcode/macOS
          # image (AIR 2.8 vs 2.7 link mismatch). Bump when the pinned image changes.
          prefix-key: "v2-mlx-air-macos15"
          cache-directories: ${{ github.workspace }}/.mlx-metal

      - name: Generate coverage and enforce threshold
        run: |
          cargo llvm-cov \
            --all-features \
            --workspace \
            --fail-under-lines 70 \
            --ignore-filename-regex '(qwen3_next|batch_engine|simple|siglip|llava_qwen2)\.rs|higgs/src/(main|state|lib)\.rs|routes/(anthropic|completions|embeddings)\.rs' \
            -- --test-threads=1

      - name: Generate LCOV report
        if: success() || failure()
        run: |
          cargo llvm-cov \
            --all-features \
            --workspace \
            --lcov \
            --output-path lcov.info \
            --ignore-filename-regex '(qwen3_next|batch_engine|simple|siglip|llava_qwen2)\.rs|higgs/src/(main|state|lib)\.rs|routes/(anthropic|completions|embeddings)\.rs' \
            -- --test-threads=1

      - name: Upload LCOV report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info

  omen:
    name: Omen Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Omen
        uses: panbanda/omen@omen-v4.28.0
        id: omen
        with:
          version: "4.28.0"
          comment: false
          label: false
          check: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
