[server]
host = "127.0.0.1"
port = 8000

[[models]]
path = "/Users/example/models/Thinklite-27B-4bit"
name = "thinklite"
# Loading this model intermittently hits a Metal GPU timeout right after GDN projection fusion
# (2 of 6 loads in testing). Start higgs with HIGGS_SEPARATE_GDN_PROJ=1 to skip that step.
mlx_profile = "balanced"

[default]
provider = "higgs"

[retention]
enabled = true
minutes = 60
