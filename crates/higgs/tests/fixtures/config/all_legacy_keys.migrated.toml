# Every key of the pre-redesign schema, each with a value that differs from its default.

[server]
host = "0.0.0.0"
port = 8123
max_tokens = 16384
api_key = "sk-fixture-not-a-secret"
rate_limit = 120
request_timeout = "90500ms" # seconds
max_body_size = 20971520 # bytes
cors_origins = ["https://app.example.com", "http://localhost:5173"]

[defaults]
profile = "throughput"
thinking_budget = 128
load = "on_demand"
idle_ttl = "15m"

[memory]
raise_wired_limit = true
max_loaded_models = 3
limit = "49664MB"
guard = "balanced"

[[models]]
path = "mlx-community/Qwen3-4B-4bit"
name = "qwen"
profile = "latency"
batch = true
thinking_budget = 64
load = "startup"
idle_ttl = "0s"
pinned = true

[models.prefix_cache]
disk_dir = "/var/lib/higgs/prefix-kv"
disk_budget = "8GB"

[models.prefill]
yield_tokens = 512

[[models]]
path = "mlx-community/Qwen3-8B-4bit"
name = "turbo"
batch = false

[models.kv_cache]
mode = "turboquant"
bits = 4
key_bits = 3
value_bits = 4
norm_correction = false
adaptive_dense_layers = 2
seed = 7

[[models]]
path = "mlx-community/DeepSeek-V2-Lite-4bit"
name = "deepseek"
batch = "auto"

[models.kv_cache]
mla_latent = true

[[models]]
path = "mlx-community/Llama-3.2-1B-Instruct-4bit"
name = "router"

[providers.anthropic]
url = "https://api.anthropic.com"
format = "anthropic"
api_key = "sk-ant-fixture-not-a-secret"
stub_count_tokens = true

[providers.ollama]
url = "http://localhost:11434"
strip_auth = true

[[routes]]
name = "code"
description = "Programming questions"
match = "claude-.*"
provider = "anthropic"
model = "claude-sonnet-4-5"

[[routes]]
match = "llama.*"
provider = "ollama"

[routing]
default = "ollama"

[routing.auto]
enabled = true
force = true
model = "router"
timeout = "1500ms"

[observability]
retention = "30m"

[observability.metrics_log]
enabled = true
path = "/var/log/higgs/metrics.jsonl"
max_size = "25MB"
max_files = 3

[mcp]
max_result_size = "128KB"

[mcp.servers.filesystem]
enabled = true
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
env = { EXAMPLE_TOKEN = "literal-value" }
cwd = "/tmp"
timeout = "45s"

[mcp.servers.remote]
url = "https://mcp.example.com/mcp"
headers = { Authorization = "Bearer literal-token" }
timeout = "12500ms"

[web]
enabled = true
search_provider = "searxng"
searxng_url = "http://localhost:8888"
allow_private_addresses = true
expose_as_tools = true
timeout = "20s"
