[package]
name = "higgs-bench"
version = "1.0.1"
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
higgs-engine = { workspace = true }
higgs-models = { workspace = true }
mlx-rs = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.38"
sha2 = "0.11"
tokio = { workspace = true }
tokenizers.workspace = true
toml = "1.0"

[build-dependencies]
built = { version = "0.8", features = ["git2"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "bench_decode"
path = "src/bin/bench_decode.rs"

[[bin]]
name = "bench_frontier"
path = "src/bin/bench_frontier.rs"

[[bin]]
name = "bench_speculative"
path = "src/bin/bench_speculative.rs"

[[bin]]
name = "bench_summarize"
path = "src/bin/bench_summarize.rs"

[[bin]]
name = "quality_gate"
path = "src/bin/quality_gate.rs"
